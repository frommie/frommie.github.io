<!doctype html>
<!--
  Template for public/og.png (1200×630).
  Regenerate after design changes:

  TMPPROF=$(mktemp -d) && "/Applications/Firefox.app/Contents/MacOS/firefox" \
    --headless --profile "$TMPPROF" --window-size=1200,630 \
    --screenshot="$(pwd)/public/og.png" \
    "file://$(pwd)/scripts/og-template.html"

  Colours and type mirror DESIGN.md (light mode, terracotta accent).
-->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Lora';
    src: url('../node_modules/@fontsource/lora/files/lora-latin-600-normal.woff2') format('woff2');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Sora';
    src: url('../node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 800;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 800;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    background: #faf8f4;
    color: #1c1813;
    font-family: 'Sora', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 64px;
  }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #696258;
  }

  h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 84px;
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin-bottom: 28px;
  }

  h1 .accent { color: #b34a22; }

  .bio {
    font-size: 30px;
    font-weight: 400;
    color: #6e675d;
    line-height: 1.5;
    max-width: 820px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .domain {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: #b34a22;
  }

  .dots { display: flex; gap: 12px; }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #d1cabd;
  }
  .dot:last-child { background: #b34a22; }
</style>
</head>
<body>
  <div class="label">christian frommert</div>

  <div>
    <h1>Hallo, ich bin Christian<span class="accent">.</span></h1>
    <p class="bio">Fotos, kurze Gedanken und Dinge, die ich gebaut habe — SAP-Berater tagsüber, Hobbyfotograf dazwischen.</p>
  </div>

  <div class="footer">
    <span class="domain">frommie.dev</span>
    <div class="dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>
</body>
</html>
